<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a15">
<title>悬浮跑车</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Big+Shoulders+Display:wght@800&display=swap" rel="stylesheet">
<style>
/* Layout: one portrait stage (max 520px wide) fills the screen. The canvas draws the world, HUD and the two jet zones; two DOM panels (start, crash) sit on top. Single committed look: dusk over a rocket test range. */
:root {
  color-scheme: dark;
  --page: #0d0a15;
  --sky-top: #14122b;
  --sky-mid: #4a2a5c;
  --horizon: #f0905a;
  --far: #1d1530;
  --ground: #17121f;
  --ground-line: #3a2f4a;
  --steel: #2b2536;
  --steel-hi: #5a5072;
  --steel-lo: #1b1625;
  --car: #ecebf2;
  --car-shade: #8f8ba3;
  --glass: #1a1626;
  --tail: #ff3b4e;
  --jet: #d3f0ff;
  --hazard: #ffc933;
  --hazard-dark: #1b1620;
  --ink: #f4f1f8;
  --ink-dim: #bdb4cd;
  --gas: #7fd6ff;
  --gas-low: #ff7a59;
  --void: #07050c;
  --panel-top: rgba(13, 10, 21, 0.55);
  --panel-bottom: rgba(13, 10, 21, 0.92);
  --font-display: 'Big Shoulders Display', 'Arial Narrow', Impact, 'PingFang SC', sans-serif;
  --font-body: 'Barlow', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
}
html, body { height: 100%; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
body {
  box-sizing: border-box;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font-body);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.shell { height: 100%; max-width: 520px; margin: 0 auto; min-width: 0; }
.stage { position: relative; height: 100%; overflow: hidden; background: var(--sky-top); border-radius: 14px; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.panel {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center; gap: 18px;
  padding: 28px 24px;
  background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
}
.panel[hidden], .badge[hidden] { display: none !important; }
.eyebrow { font: 600 13px/1 var(--font-body); letter-spacing: 0.18em; color: var(--hazard); }
h1, h2 { margin: 0; font: 800 76px/0.95 var(--font-display); letter-spacing: 0.01em; text-wrap: balance; }
h2 { font-size: 64px; }
.lede { margin: 0; font-size: 16px; line-height: 1.5; color: var(--ink-dim); max-width: 30ch; }
.how { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.how li { display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: baseline; gap: 12px; font-size: 16px; line-height: 1.4; color: var(--ink-dim); }
.how b { font: 800 26px/1 var(--font-display); color: var(--ink); letter-spacing: 0.04em; }
.big { display: flex; align-items: baseline; gap: 8px; font: 800 96px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.big small { font: 600 20px/1 var(--font-body); color: var(--ink-dim); letter-spacing: 0.1em; }
.why { margin: 0; font-size: 18px; color: var(--ink); }
.best { margin: 0; font-size: 16px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.badge { align-self: flex-start; padding: 6px 12px; background: var(--hazard); color: var(--hazard-dark); font: 800 18px/1 var(--font-display); letter-spacing: 0.12em; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.btn {
  align-self: stretch; min-height: 60px; border: 0; cursor: pointer;
  background: var(--hazard); color: var(--hazard-dark);
  font: 800 28px/1 var(--font-display); letter-spacing: 0.2em;
  clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
}
.btn.alt { background: var(--steel); color: var(--ink); }
.btn.alt:active { background: var(--steel-hi); }
.ghost { align-self: flex-start; min-height: 40px; padding: 0 14px; border: 1px solid var(--steel-hi); background: transparent; color: var(--ink-dim); font: 600 15px/1 var(--font-body); cursor: pointer; }
.ghost:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn:active { background: var(--ink); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: -6px; }
</style>
</head>
<body>
<main class="shell">
  <div class="stage" id="stage">
    <canvas id="c" aria-label="悬浮跑车游戏画面"></canvas>

    <section class="panel" id="ov-start" aria-label="开始">
      <div class="eyebrow">A71 悬浮测试场</div>
      <h1>悬浮<br>跑车</h1>
      <p class="lede">用两种喷气飞过车队、深坑和货柜，偶尔冲进大圆坡掉头。冷气吃罐才能补满。</p>
      <ul class="how">
        <li><b>左半屏</b><span>向上喷气：点按小跳，长按持续升空</span></li>
        <li><b>右半屏</b><span>向前喷气：点按冲刺，长按加速</span></li>
        <li><b>能量罐</b><span>吃一个冷气回满，越往后越少、越险</span></li>
      </ul>
      <button class="btn" id="go" type="button">发车</button>
      <button class="ghost" id="snd" type="button">音效：开</button>
    </section>

    <section class="panel" id="ov-over" aria-label="结算" hidden>
      <div class="eyebrow">测试中断</div>
      <h2>失败了</h2>
      <p class="why" id="o-why"></p>
      <div class="big"><span id="o-score">0</span><small>分</small></div>
      <div class="badge" id="o-badge" hidden>新纪录</div>
      <p class="best">已过 <span id="o-clear">0</span> 关 · 行驶 <span id="o-dist">0</span> 米 · 最高 <span id="o-best">0</span> 分</p>
      <button class="btn" id="resume" type="button" hidden>从存档点继续</button>
      <button class="btn alt" id="again" type="button">重新开始</button>
    </section>
  </div>
</main>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var stage = document.getElementById('stage');
  var ovStart = document.getElementById('ov-start');
  var ovOver = document.getElementById('ov-over');
  var oScore = document.getElementById('o-score');
  var oBest = document.getElementById('o-best');
  var oClear = document.getElementById('o-clear');
  var oWhy = document.getElementById('o-why');
  var oBadge = document.getElementById('o-badge');
  var oDist = document.getElementById('o-dist');
  var btnResume = document.getElementById('resume');

  var rootStyle = getComputedStyle(document.documentElement);
  function tok(n) { return rootStyle.getPropertyValue(n).trim(); }
  var C = {
    skyTop: tok('--sky-top'), skyMid: tok('--sky-mid'), horizon: tok('--horizon'), far: tok('--far'),
    ground: tok('--ground'), groundLine: tok('--ground-line'),
    steel: tok('--steel'), steelHi: tok('--steel-hi'), steelLo: tok('--steel-lo'),
    car: tok('--car'), carShade: tok('--car-shade'), glass: tok('--glass'), tail: tok('--tail'), jet: tok('--jet'),
    hazard: tok('--hazard'), hazardDark: tok('--hazard-dark'), voidc: tok('--void'),
    ink: tok('--ink'), inkDim: tok('--ink-dim'), gas: tok('--gas'), gasLow: tok('--gas-low'),
    display: tok('--font-display'), body: tok('--font-body')
  };

  var reduceMotion = false;
  try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var STORE_KEY = 'hover-roadster-best-v6';
  function loadBest() { try { return parseInt(localStorage.getItem(STORE_KEY), 10) || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem(STORE_KEY, String(v)); } catch (e) {} }

  // World units: screen height is fixed at 640, width follows the screen.
  // The car always travels along `dir` (+1 right, -1 left). Each big ramp flips dir, so the route doubles back like an S.
  var H = 640, W = 360, scale = 1, dpr = 1;
  var GROUND = 560, REST_Y = GROUND - 14;
  var R = 160, RC = R - 14;
  var GRAV_AIR = 800, UP_THRUST = 1700, VY_UP = -430, VY_DOWN = 520;
  var UP_TAP_V = -300, UP_TAP_COST = 6, UP_COST = 20, HOLD_DELAY = 0.11;
  var FWD_ACC = 1500, FWD_TAP = 260, FWD_TAP_COST = 5, FWD_COST = 16, VF_MAX = 900;
  var RAMP_V = 300, RAMP_MAX = 560;
  var CAR_W = 66, CAR_STEP = 70, CAR_H = 26;
  var HARD_LANDING = 505, ROLL_DUR = 0.6;

  var state = 'ready', mode = 'ground';
  var t = 0, idleOff = 0, shake = 0;
  var carX = 0, y = REST_Y, vf = 250, vy = 0, dir = 1, phi = 0, tv = 0, rot = 0, rollT = ROLL_DUR;
  var gas = 100, distTotal = 0, camX = -100, cleared = 0, why = '', afterRamp = false;
  var pts = 0, combo = 0, comboT = 0, nearMiss = 0, cp = null, cpPending = false, cpFlash = 0, kick = 0, zoomCur = 1, camY = 0, sndOn = true, upFlash = 0, fwdFlash = 0, onDeck = null, lastUpTap = -9, lastFwdTap = -9, upStreak = 0, fwdStreak = 0, upInten = 1, fwdInten = 1;
  var upThr = false, fwdThr = false;
  var curTurn = null, segments = [], gen = null;
  var particles = [], stars = [];
  var pointers = {}, upCount = 0, fwdCount = 0, upStart = 0, fwdStart = 0;
  var best = loadBest();
  var DEG = Math.PI / 180;

  for (var i = 0; i < 70; i++) {
    stars.push({ x: Math.random() * 1200, y: Math.random() * 330, r: Math.random() * 1.2 + 0.4, ph: Math.random() * 6 });
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function meters() { return Math.max(0, Math.floor(distTotal / 12)); }
  function score() { return meters() + pts; }

  function resize() {
    var r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    scale = r.height / H;
    W = r.width / scale;
  }
  window.addEventListener('resize', resize);

  // ---------- audio (synthesised, no files) ----------
  var ac = null, noiseG = null, fwdF = null, fwdG = null, upG = null, engO = null, engG = null, sndHold = 0;
  function initAudio() {
    if (ac) { try { ac.resume(); } catch (e) {} return; }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      var len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), dd = buf.getChannelData(0);
      for (var q = 0; q < len; q++) dd[q] = Math.random() * 2 - 1;
      var noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
      fwdF = ac.createBiquadFilter(); fwdF.type = 'lowpass'; fwdF.frequency.value = 400;
      fwdG = ac.createGain(); fwdG.gain.value = 0;
      var upF = ac.createBiquadFilter(); upF.type = 'bandpass'; upF.frequency.value = 1100; upF.Q.value = 0.7;
      upG = ac.createGain(); upG.gain.value = 0;
      noise.connect(fwdF); fwdF.connect(fwdG); fwdG.connect(ac.destination);
      noise.connect(upF); upF.connect(upG); upG.connect(ac.destination);
      engO = ac.createOscillator(); engO.type = 'sawtooth'; engO.frequency.value = 60;
      var engF = ac.createBiquadFilter(); engF.type = 'lowpass'; engF.frequency.value = 240;
      engG = ac.createGain(); engG.gain.value = 0;
      engO.connect(engF); engF.connect(engG); engG.connect(ac.destination);
      noise.start(); engO.start();
    } catch (e) { ac = null; }
  }
  function updateAudio() {
    if (!ac || !fwdG) return;
    var tt = ac.currentTime;
    if (tt < sndHold) return;
    var playing = sndOn && state === 'play';
    fwdG.gain.setTargetAtTime(playing && fwdThr ? 0.55 : 0, tt, 0.05);
    fwdF.frequency.setTargetAtTime(280 + vf * 1.4, tt, 0.1);
    upG.gain.setTargetAtTime(playing && upThr ? 0.22 : 0, tt, 0.05);
    engG.gain.setTargetAtTime(playing ? 0.04 + 0.1 * vf / VF_MAX : 0, tt, 0.1);
    engO.frequency.setTargetAtTime(48 + vf * 0.22, tt, 0.1);
  }
  function boom() {
    if (!ac || !sndOn || !fwdG) return;
    var tt = ac.currentTime;
    sndHold = tt + 0.8;
    fwdF.frequency.cancelScheduledValues(tt); fwdG.gain.cancelScheduledValues(tt);
    fwdF.frequency.setValueAtTime(160, tt);
    fwdG.gain.setValueAtTime(1.1, tt);
    fwdG.gain.exponentialRampToValueAtTime(0.001, tt + 0.7);
    upG.gain.setValueAtTime(0, tt); engG.gain.setValueAtTime(0, tt);
  }
  function puff(x, y0, pvx, pvy, life, r, grow) {
    particles.push({ x: x, y: y0, vx: pvx, vy: pvy, life: life, max: life, r: r, c: C.jet, g: 0, grow: grow });
  }
  function buzz(ms) { try { if (sndOn && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  // ---------- route generation ----------
  // Modules: parked car rows, pits, containers, low gantries, oncoming cars, and (rarely) the big auto U-turn ramp.
  function lvlOf() { return gen ? Math.floor(gen.n / 3) : 0; }
  function vBase() { return 250 + 10 * Math.min(lvlOf(), 8); }
  function pickType(lvl) {
    if (gen.n === 0) return 'cars';
    if (gen.n === 1) return 'pit';
    if (gen.n === 2) return 'wall';
    var pool = [['cars', 3], ['pit', 2.5], ['wall', 2], ['tunnel', 1.5]];
    if (lvl >= 2) pool.push(['mover', 1.5]);
    if (lvl >= 1) pool.push(['gate', 2.2]);
    var tot = 0, i;
    for (i = 0; i < pool.length; i++) if (pool[i][0] !== gen.last) tot += pool[i][1];
    var r = Math.random() * tot;
    for (i = 0; i < pool.length; i++) {
      if (pool[i][0] === gen.last) continue;
      r -= pool[i][1];
      if (r <= 0) return pool[i][0];
    }
    return 'cars';
  }
  function addModule() {
    var d = gen.d, lvl = lvlOf(), seg, a, b, i;
    if (gen.since >= gen.nextTurn) {
      var xr = gen.p + d * 640;
      seg = { type: 'turn', kind: 'up', cy: GROUND - R, d: d, gd: d, xr: xr, x0: Math.min(xr, xr + d * (R + 80)), x1: Math.max(xr, xr + d * (R + 80)),
        farEdge: xr + d * (R + 80), pods: [{ x: xr + d * RC, y: GROUND - R, on: true }], used: false, skipped: false };
      var dk0 = xr + d * (R + 50), dk1 = dk0 + d * 420;
      seg.deckFar = dk1;
      segments.push(seg);
      segments.push({ type: 'deck', gd: d, x0: Math.min(dk0, dk1), x1: Math.max(dk0, dk1), top: GROUND - 220, farEdge: dk1, done: true,
        pods: [{ x: (dk0 + dk1) / 2, y: GROUND - 220 - 30, on: true }] });
      gen.p = xr; gen.pending = true;
      return;
    }
    var type = pickType(lvl);
    a = gen.p + d * gen.lead;
    var pal = [C.car, C.carShade, '#6f6a85', '#d9d4e6', '#a39fb7'];
    if (type === 'cars') {
      var n = Math.min(3 + Math.floor(lvl / 2), 8);
      b = a + d * n * CAR_STEP;
      var cars = [];
      for (i = 0; i < n; i++) {
        var left = d > 0 ? a + i * CAR_STEP : a - (i + 1) * CAR_STEP;
        cars.push({ x: left, c: pal[(i + gen.n) % pal.length] });
      }
      seg = { type: 'cars', d: d, x0: Math.min(a, b), x1: Math.max(a, b), farEdge: b, cars: cars, done: false, minGap: 999 };
    } else if (type === 'pit') {
      var w = 200 + Math.min(lvl, 5) * 28 + rnd(0, 30);
      b = a + d * w;
      var pad = lvl >= 1 && Math.random() < 0.5;
      seg = { type: 'pit', x0: Math.min(a, b), x1: Math.max(a, b), farEdge: b, done: false, pad: pad, padX: a - d * 140, padUsed: false };
    } else if (type === 'wall') {
      b = a + d * 64;
      seg = { type: 'wall', x0: Math.min(a, b), x1: Math.max(a, b), farEdge: b, h: 100 + Math.min(lvl, 6) * 12 + rnd(0, 16), done: false };
    } else if (type === 'tunnel') {
      b = a + d * (320 + rnd(0, 100));
      seg = { type: 'tunnel', x0: Math.min(a, b), x1: Math.max(a, b), farEdge: b, done: false };
    } else if (type === 'gate') {
      b = a + d * 70;
      var gh = (lvl >= 5 ? 104 : 128) + rnd(0, 10);
      seg = { type: 'gate', x0: Math.min(a, b), x1: Math.max(a, b), farEdge: b, gh: gh, gapY: rnd(375, 450), done: false };
    } else {
      var cx = d > 0 ? a : a - CAR_W;
      b = a + d * 100;
      seg = { type: 'mover', d: -d, vx: -d * (130 + Math.min(lvl, 8) * 15), cars: [{ x: cx, c: pal[gen.n % pal.length] }],
        x0: cx, x1: cx + CAR_W, farEdge: d > 0 ? cx + CAR_W : cx, active: false, done: false };
    }
    seg.gd = d;
    segments.push(seg);
    gen.p = b; gen.n++; gen.since++; gen.last = type;
    gen.lead = 520 + Math.min(lvl, 6) * 20;
    // energy pod: rarer and riskier as the run goes on
    gen.sincePod++;
    if (gen.sincePod >= clamp(1 + Math.floor(lvl / 3), 1, 3)) {
      gen.sincePod = 0;
      var risky = lvl >= 3 && (type === 'cars' || type === 'pit' || type === 'wall' || type === 'gate');
      var hiY = lvl >= 4 ? 385 : 445;
      if (risky) {
        var py = type === 'wall' ? GROUND - seg.h - 38 : (type === 'gate' ? seg.gapY : (type === 'pit' ? hiY - 15 : hiY));
        seg.pods = [{ x: (a + b) / 2, y: py, on: true }];
      } else {
        seg.pods = [{ x: b + d * 230, y: GROUND - 32, on: true }];
      }
    }
  }
  function genMore() {
    if (!gen || gen.pending) return;
    for (var guard = 0; guard < 12; guard++) {
      if (gen.d * (gen.p - carX) > 1500) break;
      addModule();
      if (gen.pending) break;
    }
  }

  function reset() {
    segments = []; particles = [];
    gen = { p: 0, d: 1, n: 0, since: 0, nextTurn: 7, sincePod: 99, last: '', lead: 560, pending: false };
    carX = 0; y = REST_Y; vf = vBase(); vy = 0; dir = 1; phi = 0; tv = 0; rot = 0; rollT = ROLL_DUR;
    gas = 100; distTotal = 0; cleared = 0; why = ''; afterRamp = false; mode = 'ground';
    pts = 0; combo = 0; comboT = 0; nearMiss = 0; upFlash = 0; fwdFlash = 0; onDeck = null; lastUpTap = -9; lastFwdTap = -9; upStreak = 0; fwdStreak = 0; cp = null; cpPending = false; cpFlash = 0; kick = 0; zoomCur = 1;
    upThr = false; fwdThr = false; pointers = {}; upCount = 0; fwdCount = 0; curTurn = null;
    camX = carX - W * 0.28; camY = 0;
    genMore();
  }

  function start() {
    reset();
    state = 'play';
    ovStart.hidden = true;
    ovOver.hidden = true;
  }

  function resume() {
    if (!cp) { start(); return; }
    segments = []; particles = [];
    dir = cp.dir; carX = cp.x; y = REST_Y; vy = 0; mode = 'ground'; vf = vBase(); onDeck = null;
    gas = Math.max(cp.gas, 70); rot = 0; rollT = ROLL_DUR; afterRamp = false; curTurn = null;
    gen.d = dir; gen.p = carX; gen.lead = 560; gen.pending = false; gen.sincePod = 99;
    combo = 0; comboT = 0; cpPending = false; kick = 0;
    upThr = false; fwdThr = false; pointers = {}; upCount = 0; fwdCount = 0;
    camX = carX - W * (dir > 0 ? 0.28 : 0.72); camY = 0;
    state = 'play';
    ovOver.hidden = true; ovStart.hidden = true;
    genMore();
  }

  function crash(reason) {
    if (state !== 'play') return;
    if (window.__hr && window.__hr.god) return;
    state = 'over';
    why = reason;
    shake = reduceMotion ? 0 : 0.5;
    var cols = [C.hazard, C.horizon, C.ink, C.carShade];
    for (var i = 0; i < 46; i++) {
      var a = Math.random() * Math.PI * 2, sp = rnd(80, 380);
      particles.push({ x: carX, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: rnd(0.5, 1.1), max: 1.1, r: rnd(2, 5), c: cols[i % cols.length], g: 300, grow: 0 });
    }
    for (var j = 0; j < 14; j++) {
      particles.push({ x: carX + rnd(-12, 12), y: y + rnd(-6, 6), vx: rnd(-90, 90), vy: rnd(-90, -10), life: rnd(0.7, 1.3), max: 1.3, r: rnd(6, 12), c: C.carShade, g: -20, grow: 16 });
    }
    boom(); buzz(140);
    var sc = score();
    var isNew = sc > best && sc > 0;
    if (isNew) { best = sc; saveBest(best); }
    setTimeout(function () {
      oScore.textContent = String(sc);
      oBest.textContent = String(best);
      oClear.textContent = String(cleared);
      oDist.textContent = String(meters());
      oWhy.textContent = reason;
      oBadge.hidden = !isNew;
      btnResume.hidden = !cp;
      ovOver.hidden = false;
    }, 700);

    ctx.fillStyle = OBST;
    ctx.fillRect(g.x0 - 8, -400, 12, GROUND + 400 - 88);
    ctx.fillRect(g.x1 - 4, -400, 12, GROUND + 400 - 88);
    ctx.fillRect(g.x0, GROUND - 88, g.x1 - g.x0, 18);
    stripes(g.x0, g.x1, GROUND - 76, 6);
    outline(g.x0, GROUND - 88, g.x1 - g.x0, 18);
  }

  function drawDeck(g) {
    var w = g.x1 - g.x0;
    ctx.fillStyle = C.steel;
    for (var lx = g.x0 + 30; lx < g.x1 - 10; lx += 140) ctx.fillRect(lx, g.top + 18, 10, GROUND - g.top - 18);
    ctx.fillStyle = OBST;
    ctx.fillRect(g.x0, g.top, w, 18);
    stripes(g.x0, g.x1, g.top, 6);
    outline(g.x0, g.top, w, 18);
  }

  function drawGate(g) {
    var gt = g.gapY - g.gh / 2, gb = g.gapY + g.gh / 2, w = g.x1 - g.x0;
    ctx.fillStyle = OBST;
    ctx.fillRect(g.x0, -400, w, gt + 400);
    ctx.fillRect(g.x0, gb, w, GROUND - gb);
    ctx.fillStyle = C.steel;
    for (var xx = g.x0 + 8; xx < g.x1; xx += 12) { ctx.fillRect(xx, -400, 3, gt + 400); ctx.fillRect(xx, gb, 3, GROUND - gb); }
    stripes(g.x0, g.x1, gt - 8, 8);
    stripes(g.x0, g.x1, gb, 8);
    outline(g.x0, -400, w, gt + 400);
    outline(g.x0, gb, w, GROUND - gb);
  }

  function drawRamp(s) {
    ctx.save();
    ctx.translate(s.xr, s.cy);
    ctx.scale(s.d, 1);
    ctx.lineCap = 'butt';
    ctx.strokeStyle = C.steelLo; ctx.lineWidth = 3;
    ctx.beginPath();
    for (var a = 0; a <= 180; a += 15) {
      var th = Math.PI / 2 - a * DEG;
      ctx.moveTo((R + 20) * Math.cos(th), (R + 20) * Math.sin(th));
      ctx.lineTo((R + 72) * Math.cos(th), (R + 72) * Math.sin(th));
    }
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, R + 72, -Math.PI / 2, Math.PI / 2, false);
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var b = 0; b < 180; b += 15) {
      var t1 = Math.PI / 2 - b * DEG, t2 = Math.PI / 2 - (b + 15) * DEG;
      ctx.moveTo((R + 20) * Math.cos(t1), (R + 20) * Math.sin(t1));
      ctx.lineTo((R + 72) * Math.cos(t2), (R + 72) * Math.sin(t2));
    }
    ctx.stroke();
    ctx.lineWidth = 26; ctx.strokeStyle = C.steel;
    ctx.beginPath(); ctx.arc(0, 0, R + 13, -Math.PI / 2, Math.PI / 2, false); ctx.stroke();
    ctx.lineWidth = 4; ctx.strokeStyle = C.steelHi;
    ctx.beginPath(); ctx.arc(0, 0, R + 2, -Math.PI / 2, Math.PI / 2, false); ctx.stroke();
    // exit lip at the top
    ctx.fillStyle = C.hazard;
    ctx.fillRect(-4, -(R + 26), 16, 6);
    ctx.restore();

    if (s.kind === 'up2') return;
    // painted chevrons leading into the ramp
    ctx.save();
    ctx.fillStyle = C.hazard;
    ctx.globalAlpha = 0.6;
    for (var i = 0; i < 5; i++) {
      var x = s.xr - s.d * (30 + i * 40);
      ctx.save();
      ctx.translate(x, 0);
      ctx.scale(s.d, 1);
      ctx.beginPath();
      ctx.moveTo(-10, GROUND + 14); ctx.lineTo(4, GROUND + 14); ctx.lineTo(14, GROUND + 26); ctx.lineTo(4, GROUND + 38); ctx.lineTo(-10, GROUND + 38); ctx.lineTo(0, GROUND + 26);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function carBody(bodyTop, bodyBottom) {
    var bodyG = ctx.createLinearGradient(0, -12, 0, 8);
    bodyG.addColorStop(0, bodyTop);
    bodyG.addColorStop(1, bodyBottom);
    ctx.fillStyle = bodyG;
    ctx.beginPath();
    ctx.moveTo(-32, 7);
    ctx.lineTo(-33, -1);
    ctx.quadraticCurveTo(-30, -5, -18, -6);
    ctx.quadraticCurveTo(-8, -13, 4, -10);
    ctx.quadraticCurveTo(14, -7, 22, -3);
    ctx.quadraticCurveTo(31, -1, 33, 3);
    ctx.lineTo(33, 7);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = C.glass;
    ctx.beginPath();
    ctx.moveTo(-14, -5);
    ctx.quadraticCurveTo(-6, -10, 3, -8.5);
    ctx.lineTo(13, -4);
    ctx.lineTo(-14, -4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = C.tail;
    ctx.fillRect(-33, -1, 3, 3);
    ctx.fillStyle = C.hazardDark;
    ctx.beginPath(); ctx.arc(-20, 8, 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(21, 8, 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.carShade;
    ctx.beginPath(); ctx.arc(-20, 8, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(21, 8, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  function drawParked(seg, cr) {
    ctx.save();
    ctx.translate(cr.x + CAR_W / 2, GROUND - 14.5);
    ctx.scale(seg.d, 1);
    carBody(cr.c, C.carShade);
    ctx.restore();
  }

  function drawPod(p) {
    ctx.fillStyle = C.car;
    ctx.fillRect(p.x - 9, p.y - 16, 18, 32);
    ctx.fillStyle = C.gas;
    ctx.fillRect(p.x - 9, p.y - 5, 18, 10);
    ctx.fillStyle = C.carShade;
    ctx.fillRect(p.x - 5, p.y - 20, 10, 4);
  }

  function drawPlayer() {
    ctx.save();
    ctx.translate(carX, y);
    var face = mode === 'ramp' ? curTurn.d : dir;
    ctx.scale(face, 1);
    var sy = 1, rl = rot;
    if (mode === 'ramp') rl = -phi;
    else if (rollT < ROLL_DUR) sy = -Math.cos(Math.PI * rollT / ROLL_DUR);
    ctx.rotate(rl);
    ctx.scale(1, sy);
    carBody(C.car, C.carShade);
    ctx.fillStyle = C.hazardDark;
    ctx.fillRect(-23, 11, 6, 3);
    ctx.fillRect(17, 11, 6, 3);
    ctx.fillStyle = C.jet;
    if (upThr || upFlash > 0) {
      var ui = upThr ? 1 : upInten;
      var fl = (upThr ? 26 : 8 + 34 * ui) + Math.random() * (4 + 10 * ui);
      var hw = 2.5 + 3 * ui;
      for (var s = -1; s <= 1; s += 2) {
        ctx.beginPath();
        ctx.moveTo(s * 20 - hw, 13);
        ctx.lineTo(s * 20 + hw, 13);
        ctx.lineTo(s * 20, 13 + fl);
        ctx.closePath();
        ctx.fill();
      }
    }
    if (fwdThr || fwdFlash > 0) {
      var fr = fwdThr ? 18 + (vf / VF_MAX) * 64 + Math.random() * 10 : 8 + 40 * fwdInten + Math.random() * 8;
      ctx.beginPath();
      ctx.moveTo(-34, -4);
      ctx.lineTo(-34, 6);
      ctx.lineTo(-34 - fr, 1);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1) * 0.85;
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.5, p.r), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function arrow(cx, cy, kind, size) {
    ctx.beginPath();
    if (kind === 'up') {
      ctx.moveTo(cx, cy - size); ctx.lineTo(cx + size * 0.8, cy); ctx.lineTo(cx + size * 0.3, cy);
      ctx.lineTo(cx + size * 0.3, cy + size); ctx.lineTo(cx - size * 0.3, cy + size);
      ctx.lineTo(cx - size * 0.3, cy); ctx.lineTo(cx - size * 0.8, cy);
    } else {
      var d = dir;
      ctx.moveTo(cx + d * size, cy); ctx.lineTo(cx, cy - size * 0.8); ctx.lineTo(cx, cy - size * 0.3);
      ctx.lineTo(cx - d * size, cy - size * 0.3); ctx.lineTo(cx - d * size, cy + size * 0.3);
      ctx.lineTo(cx, cy + size * 0.3); ctx.lineTo(cx, cy + size * 0.8);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawZones() {
    var bw = W / 2 - 22, bh = 44, by = H - 14 - bh;
    var zones = [
      { x: 16, kind: 'up', label: '向上喷气', on: upCount > 0 },
      { x: W / 2 + 6, kind: 'fwd', label: '向前喷气', on: fwdCount > 0 }
    ];
    ctx.font = "600 15px " + C.body;
    ctx.textBaseline = 'middle';
    for (var i = 0; i < zones.length; i++) {
      var z = zones[i];
      ctx.fillStyle = z.on ? 'rgba(255,201,51,0.9)' : 'rgba(13,10,21,0.55)';
      ctx.fillRect(z.x, by, bw, bh);
      ctx.strokeStyle = 'rgba(244,241,248,0.25)'; ctx.lineWidth = 1;
      ctx.strokeRect(z.x + 0.5, by + 0.5, bw - 1, bh - 1);
      ctx.fillStyle = z.on ? C.hazardDark : C.ink;
      arrow(z.x + 26, by + bh / 2, z.kind, 9);
      ctx.textAlign = 'left';
      ctx.fillText(z.label, z.x + 46, by + bh / 2 + 1);
    }
    ctx.textBaseline = 'alphabetic';
  }

  function nextSeg() {
    var bestS = null, bd = 1e9;
    for (var i = 0; i < segments.length; i++) {
      var g = segments[i];
      if (g.done || g.used || g.skipped) continue;
      if ((g.type === 'turn' ? g.d : g.gd) !== dir) continue;
      var far = g.type === 'turn' ? g.xr : g.farEdge;
      if (dir * (far - carX) < -20) continue;
      var dist = dir * ((dir > 0 ? g.x0 : g.x1) - carX);
      if (dist < bd) { bd = dist; bestS = g; }
    }
    return bestS ? { seg: bestS, dist: bd } : null;
  }

  var HINTS = {
    cars: '车队前：左半屏起飞，右半屏冲刺',
    pit: '深坑：起飞加速飞过去',
    wall: '货柜很高：长按左半屏拉高',
    tunnel: '低梁：别跳，贴地通过',
    gate: '闸门：从中间缺口穿过',
    mover: '迎面来车：跳过去',
    turn: '冲进大圆坡，或飞到最高越过去'
  };

  function drawHud() {
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = C.ink;
    ctx.font = "800 38px " + C.display;
    ctx.fillText(String(score()), 16, 46);

    ctx.textAlign = 'right';
    ctx.fillStyle = C.ink;
    ctx.font = "800 22px " + C.display;
    ctx.fillText('已过 ' + cleared + ' 关', W - 16, 28);
    ctx.fillStyle = C.inkDim;
    ctx.font = "600 13px " + C.body;
    ctx.fillText(combo > 1 ? '连击 ×' + combo : '最高 ' + best + ' 分', W - 16, 48);

    var bw = 140, bh = 8, bx = 16, by = 58;
    ctx.fillStyle = 'rgba(13,10,21,0.6)';
    ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
    var low = gas < 22;
    var flicker = low && Math.sin(t * 22) > 0;
    ctx.fillStyle = low ? (flicker ? C.ink : C.gasLow) : C.gas;
    ctx.fillRect(bx, by, bw * gas / 100, bh);
    ctx.textAlign = 'left';
    ctx.fillStyle = C.inkDim;
    ctx.font = "600 13px " + C.body;
    ctx.fillText('冷气 ' + Math.round(gas) + '%', bx + bw + 10, by + 8);
    ctx.fillText(Math.round(vf * 0.4) + ' km/h  ·  ' + meters() + ' m', bx, by + 30);

    var msg = '', warn = false;
    if (state === 'play') {
      if (mode === 'air' && vy > 430 && y > GROUND - 240) { msg = '长按左半屏缓降'; warn = true; }
      else if (cpFlash > 0) msg = '存档点已记录';
      else if (nearMiss > 0) msg = '擦顶 +50';
      else if (mode === 'ramp') { if (cleared < 8) msg = curTurn && curTurn.kind === 'up2' ? '绕上更高的大环' : '自动绕坡'; }
      else if (onDeck && onDeck.toRing && cleared < 12) msg = '平台尽头是第二个更高的大环，保持速度';
      else if (cleared < 6) {
        var ns = nextSeg();
        if (ns && ns.dist < 560) msg = (ns.seg.kind === 'up2') ? '第二个更高的大环：冲进去' : (HINTS[ns.seg.type] || '');
        else if (mode === 'air' && afterRamp) msg = '飞出来了，准备缓降';
      }
      if (!msg && gas < 30 && mode !== 'ramp') { msg = '冷气不多了，去吃蓝色能量罐'; warn = true; }
    }
    if (msg) {
      ctx.textAlign = 'center';
      ctx.font = "600 16px " + C.body;
      var mw = ctx.measureText(msg).width;
      if (mw > W - 24) ctx.font = "600 " + Math.max(10, Math.floor(16 * (W - 24) / mw)) + "px " + C.body;
      ctx.fillStyle = warn ? C.gasLow : C.ink;
      ctx.fillText(msg, W / 2, 112);
    }
    drawZones();
  }

  function draw() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 18, rnd(-1, 1) * shake * 18);
    if (state === 'play' && fwdThr && !reduceMotion) {
      var rum = 0.3 + vf / VF_MAX * 1.8;
      ctx.translate(rnd(-1, 1) * rum, rnd(-1, 1) * rum);
    }
    var scroll = camX + idleOff;
    ctx.save();
    ctx.translate(0, camY * 0.3);
    drawSky(scroll);
    ctx.restore();
    ctx.save();
    ctx.translate(0, camY);
    drawSkyline(scroll);
    ctx.restore();
    var z = zoomCur, sx = clamp(carX - camX, 0, W);
    ctx.save();
    ctx.translate(0, camY);
    ctx.translate(sx, GROUND);
    ctx.scale(z, z);
    ctx.translate(-sx, -GROUND);
    ctx.translate(-camX, 0);
    var visL = camX + sx - sx / z - 60, visR = camX + sx + (W - sx) / z + 60;
    var i, j, g;
    for (i = 0; i < segments.length; i++) {
      g = segments[i];
      if (g.type === 'turn' && g.x1 > visL - 100 && g.x0 < visR + 100) drawRamp(g);
    }
    drawGround(visL, visR);
    for (i = 0; i < segments.length; i++) {
      g = segments[i];
      if (g.type === 'turn' || g.type === 'pit' || g.x1 < visL - 100 || g.x0 > visR + 100) continue;
      if (g.type === 'cars' || g.type === 'mover') { for (j = 0; j < g.cars.length; j++) drawParked(g, g.cars[j]); }
      else if (g.type === 'wall') drawWall(g);
      else if (g.type === 'tunnel') drawTunnel(g);
      else if (g.type === 'gate') drawGate(g);
      else if (g.type === 'deck') drawDeck(g);
    }
    for (i = 0; i < segments.length; i++) {
      g = segments[i];
      if (!g.pods) continue;
      for (j = 0; j < g.pods.length; j++) if (g.pods[j].on && g.pods[j].x > visL - 40 && g.pods[j].x < visR + 40) drawPod(g.pods[j]);
    }
    if (state !== 'over') drawPlayer();
    drawParticles();
    ctx.restore();
    ctx.restore();
    if (state === 'play' || state === 'over') drawHud();
  }

  // ---------- input ----------
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var r = cv.getBoundingClientRect();
    var zone = (e.clientX - r.left) < r.width / 2 ? 'up' : 'fwd';
    initAudio();
    press('p' + e.pointerId, zone);
  });
  window.addEventListener('pointerup', function (e) { release('p' + e.pointerId); });
  window.addEventListener('pointercancel', function (e) { release('p' + e.pointerId); });
  window.addEventListener('blur', function () { pointers = {}; upCount = 0; fwdCount = 0; });
  var UPKEYS = { Space: 1, ArrowUp: 1, KeyW: 1 };
  var FWDKEYS = { ArrowRight: 1, ArrowLeft: 1, KeyD: 1, KeyF: 1 };
  window.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if (UPKEYS[e.code]) { e.preventDefault(); press('k' + e.code, 'up'); }
    else if (FWDKEYS[e.code]) { e.preventDefault(); press('k' + e.code, 'fwd'); }
  });
  window.addEventListener('keyup', function (e) { release('k' + e.code); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.getElementById('go').addEventListener('click', function () { initAudio(); start(); });
  document.getElementById('again').addEventListener('click', function () { initAudio(); start(); });
  btnResume.addEventListener('click', function () { initAudio(); resume(); });
  var sndBtn = document.getElementById('snd');
  try { sndOn = localStorage.getItem('hover-roadster-snd') !== '0'; } catch (e) {}
  sndBtn.textContent = sndOn ? '音效：开' : '音效：关';
  sndBtn.addEventListener('click', function () {
    sndOn = !sndOn;
    sndBtn.textContent = sndOn ? '音效：开' : '音效：关';
    try { localStorage.setItem('hover-roadster-snd', sndOn ? '1' : '0'); } catch (e) {}
  });

  // Small hook used for automated testing of difficulty.
  window.__hr = {
    manual: false,
    start: start,
    pressUp: function () { press('botU', 'up'); },
    releaseUp: function () { release('botU'); },
    pressFwd: function () { press('botF', 'fwd'); },
    releaseFwd: function () { release('botF'); },
    step: function (dt) { update(dt); },
    snap: function () {
      var pods = [];
      segments.forEach(function (s) { (s.pods || []).forEach(function (q) { if (q.on) pods.push({ x: q.x, y: q.y }); }); });
      return { state: state, mode: mode, x: carX, y: y, vf: vf, vy: vy, dir: dir, gas: gas, phi: phi, cleared: cleared, why: why, score: score(), pts: pts, hasCp: !!cp, pods: pods,
        segs: segments.map(function (s) { return { type: s.type, d: s.d, gd: s.gd, x0: s.x0, x1: s.x1, xr: s.xr, far: s.farEdge, h: s.h, top: s.top, gapY: s.gapY, gh: s.gh, done: s.done, used: s.used, pad: s.pad, padX: s.padX, padUsed: s.padUsed }; }) };
    },
    resume: resume,
    tp: function (x, yy, v, md) { carX = x; y = yy; vf = v; mode = md || 'ground'; vy = 0; camX = carX - W * (dir > 0 ? 0.28 : 0.72); zoomCur = 1 - 0.24 * clamp((v - 250) / 650, 0, 1); }
  };

  // ---------- loop ----------
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
    last = now;
    if (!window.__hr.manual) update(dt);
    updateAudio();
    draw();
    requestAnimationFrame(frame);
  }
  resize();
  reset();
  requestAnimationFrame(function (n) { last = n; frame(n); });
})();
</script>
</body>
</html>
